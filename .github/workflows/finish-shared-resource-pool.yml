name: Finish shared resource pool

on:
  push:
    branches:
      - perf/shared-resource-pool

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/shared-resource-pool
          fetch-depth: 0
      - name: Apply shared resource integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/finish-resource-pool.py')
          text = path.read_text(encoding='utf-8')
          old = '''    count = text.count(old)
              if count != 1:
          '''.replace('              ', '    ')
          new = '''    count = text.count(old)
              if label == "resource pool globals" and count == 2:
                  return text.replace(old, new, 1)
              if count != 1:
          '''.replace('              ', '    ')
          if old not in text:
              raise SystemExit('updater helper matcher not found')
          text = text.replace(old, new, 1)
          marker = "old_launch = '''    if command -v setsid"
          if marker not in text:
              raise SystemExit('video launch matcher declaration not found')
          text = text.replace(marker, "old_launch = r'''    if command -v setsid", 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/finish-resource-pool.py
          bash -n lib/resource-pool.sh
          bash -n lib/hardcore-archive-image-helper.sh
          bash -n lib/hardcore-archive-core.sh
          python3 -m py_compile lib/hardcore-archive-resource-run.py
          bash tests/resource-pool.sh
          bash tests/image-performance-policy.sh
          bash tests/module-layout.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/hardcore-archive-resource-run.py lib/resource-pool.sh \
              lib/hardcore-archive-image-helper.sh lib/hardcore-archive-core.sh \
              tests/frontend-policy.sh tests/module-layout.sh tests/resource-pool.sh \
              tests/image-performance-policy.sh
          git diff --cached --quiet && exit 0
          git commit -m 'Share CPU and RAM scheduling across archive lanes'
          git push origin HEAD:perf/shared-resource-pool
