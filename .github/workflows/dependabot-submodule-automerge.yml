name: Dependabot encoder submodule auto-merge

on:
  workflow_run:
    workflows: ["Runtime tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-encoder-bump:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate and merge an encoder-only Dependabot PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail

          pr_number=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          [[ -n $pr_number ]] || {
            echo 'No pull request is associated with this workflow run.'
            exit 0
          }

          pr=$(gh api "repos/$REPO/pulls/$pr_number")
          author=$(jq -r '.user.login' <<<"$pr")
          base=$(jq -r '.base.ref' <<<"$pr")
          state=$(jq -r '.state' <<<"$pr")
          draft=$(jq -r '.draft' <<<"$pr")
          head_sha=$(jq -r '.head.sha' <<<"$pr")
          tested_sha=$(jq -r '.workflow_run.pull_requests[0].head.sha // .workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")

          [[ $author == 'dependabot[bot]' ]] || {
            echo "PR #$pr_number is not a Dependabot PR; leaving it alone."
            exit 0
          }
          [[ $base == main && $state == open && $draft == false ]] || {
            echo "PR #$pr_number is not an open, non-draft PR targeting main."
            exit 0
          }
          [[ -n $tested_sha && $head_sha == "$tested_sha" ]] || {
            echo 'The PR head moved after the successful Runtime tests run; refusing to merge untested code.'
            exit 0
          }

          mapfile -t files < <(
            gh api --paginate "repos/$REPO/pulls/$pr_number/files?per_page=100" --jq '.[].filename'
          )
          ((${#files[@]} >= 1 && ${#files[@]} <= 2)) || {
            echo 'Dependabot PR changes more files than an encoder submodule bump should.' >&2
            exit 1
          }
          for file in "${files[@]}"; do
            case "$file" in
              vendor/AV1Encode|vendor/265Encode) ;;
              *)
                echo "Unexpected changed file: $file" >&2
                exit 1
                ;;
            esac
          done

          tree=$(gh api "repos/$REPO/git/trees/$head_sha?recursive=1")
          for path in vendor/AV1Encode vendor/265Encode; do
            mode=$(jq -r --arg path "$path" '.tree[] | select(.path == $path) | .mode' <<<"$tree")
            type=$(jq -r --arg path "$path" '.tree[] | select(.path == $path) | .type' <<<"$tree")
            [[ $mode == 160000 && $type == commit ]] || {
              echo "$path is no longer a Git submodule at the tested head." >&2
              exit 1
            }
          done

          echo "Runtime tests passed and PR #$pr_number is an encoder-only Dependabot bump. Merging tested head $head_sha."
          gh pr merge "$pr_number" --repo "$REPO" --squash --match-head-commit "$head_sha"
