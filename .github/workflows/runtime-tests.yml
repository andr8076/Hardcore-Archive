name: Runtime tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shell-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install modern Bash on macOS
        if: runner.os == 'macOS'
        run: brew install bash
      - name: Run runtime and layout tests
        shell: bash
        run: |
          if [[ $RUNNER_OS == macOS ]]; then
            BASH_BIN="$(brew --prefix)/bin/bash"
          else
            BASH_BIN=bash
          fi
          "$BASH_BIN" tests/module-layout.sh
          "$BASH_BIN" tests/resource-pool.sh
          "$BASH_BIN" tests/nested-parallel.sh
          "$BASH_BIN" tests/bundled-runtime.sh
          "$BASH_BIN" tests/runtime-bootstrap.sh
          "$BASH_BIN" tests/ffmpeg-detection.sh
          "$BASH_BIN" tests/png-validation.sh
          python3 tests/video-quality-performance.py
          python3 tests/video-final-quality.py
          python3 tests/zopfli-adaptive.py
          python3 tests/benchmark-workloads.py
          # Native macOS ACLs must actually round-trip on an Apple filesystem;
          # Linux runs the same validation/routing tests without Apple APIs.
          export PATH="$(dirname "$(command -v "$BASH_BIN")"):$PATH"
          python3 tests/acl-platform.py

  video-quality-integration:
    # This lane is intentionally strict. The ordinary developer-facing Python
    # suites may skip real-media cases when FFmpeg is unavailable; this job may
    # not. It activates the checksum-verified HCA media runtime, verifies that
    # it matches packaging/media-runtime/versions.env, probes libvmaf and both
    # production-selected model families, then runs real production acceptance.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install modern Bash on macOS
        if: runner.os == 'macOS'
        run: brew install bash
      - name: Run strict real video quality integration
        shell: bash
        run: |
          if [[ $RUNNER_OS == macOS ]]; then
            BASH_BIN="$(brew --prefix)/bin/bash"
          else
            BASH_BIN=bash
          fi
          "$BASH_BIN" tests/video-real-ci.sh

  frontend-policy:
    runs-on: ubuntu-latest
    env:
      HARDCORE_ARCHIVE_AUTO_RUNTIME: 0
    steps:
      - uses: actions/checkout@v4
      - name: Run complete policy suite
        shell: bash
        run: bash tests/frontend-policy.sh
