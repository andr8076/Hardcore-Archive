name: Runtime tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shell-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install modern Bash on macOS
        if: runner.os == 'macOS'
        run: brew install bash
      - name: Run runtime and layout tests
        shell: bash
        run: |
          if [[ $RUNNER_OS == macOS ]]; then
            BASH_BIN="$(brew --prefix)/bin/bash"
          else
            BASH_BIN=bash
          fi
          "$BASH_BIN" tests/module-layout.sh
          "$BASH_BIN" tests/resource-pool.sh
          "$BASH_BIN" tests/bundled-runtime.sh
          "$BASH_BIN" tests/runtime-bootstrap.sh
          "$BASH_BIN" tests/ffmpeg-detection.sh
          # Native macOS ACLs must actually round-trip on an Apple filesystem;
          # Linux runs the same validation/routing tests without Apple APIs.
          export PATH="$(dirname "$(command -v "$BASH_BIN")"):$PATH"
          python3 tests/acl-platform.py

  frontend-policy:
    runs-on: ubuntu-latest
    env:
      HARDCORE_ARCHIVE_AUTO_RUNTIME: 0
    steps:
      - uses: actions/checkout@v4
      - name: Run complete policy suite
        shell: bash
        run: bash tests/frontend-policy.sh
