name: Media runtime release

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: media-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl xz-utils pkg-config meson ninja-build nasm yasm python3 xxd \
            libva-dev libdrm-dev
          if [[ $(uname -m) == x86_64 ]]; then
            sudo apt-get install -y libvpl-dev
            # NVENC/NVDEC headers are optional at build time. The runtime keeps
            # NVIDIA drivers host-owned and HCA already rejects unsupported encoders.
            sudo apt-get install -y libffnvcodec-dev || true
          fi

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install meson ninja nasm yasm pkg-config
          command -v xxd

      - name: Syntax and runtime-selection tests
        shell: bash
        run: |
          bash tests/module-layout.sh
          bash tests/media-runtime.sh

      - name: Build FFmpeg/VMAF runtime
        shell: bash
        run: bash packaging/build-media-runtime.sh

      - name: Verify bundled selection
        shell: bash
        run: |
          HARDCORE_MEDIA_RUNTIME=bundled bash tests/media-runtime-release.sh

      - name: Package release
        id: package
        shell: bash
        env:
          HCA_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          archive=$(bash packaging/package-release.sh)
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'filename=%s\n' "$(basename "$archive")" >> "$GITHUB_OUTPUT"

      - name: Verify relocated release package
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          verify_root=$(mktemp -d)
          trap 'rm -rf "$verify_root"' EXIT
          tar -xzf "$ARCHIVE" -C "$verify_root"
          release_root=$(find "$verify_root" -mindepth 1 -maxdepth 1 -type d -print -quit)
          [[ -n "$release_root" ]]
          export HARDCORE_ARCHIVE_ROOT="$release_root"
          export HARDCORE_MEDIA_RUNTIME=bundled
          source "$release_root/lib/common.sh"
          source "$release_root/lib/media-runtime.sh"
          hardcore_media_runtime_select "$release_root"
          [[ "$HARDCORE_MEDIA_RUNTIME_SOURCE" == bundled ]]
          ffmpeg -hide_banner -v error -nostdin \
            -f lavfi -i 'color=c=black:s=64x64:r=1:d=1' \
            -f lavfi -i 'color=c=black:s=64x64:r=1:d=1' \
            -filter_complex '[0:v][1:v]libvmaf=n_threads=1' \
            -frames:v 1 -f null - >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.filename }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish immutable release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
          fi
