name: One-shot VMAF source-display patch

on:
  push:
    branches: [fix/vmaf-source-display-resolution]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vmaf-source-display-resolution
          fetch-depth: 0
      - name: Patch static video quality policy
        run: python3 .github/vmaf_source_display_patch.py
      - name: Commit production patch and remove temporary patch files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/vmaf-source-display-patch.yml .github/vmaf_source_display_patch.py
          git add lib/hardcore-archive-core.sh README.md
          git commit -m "Score video quality at source display resolution"
          git push origin HEAD:fix/vmaf-source-display-resolution
