name: One-shot VMAF source-display patch

on:
  push:
    branches: [fix/vmaf-source-display-resolution]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vmaf-source-display-resolution
          fetch-depth: 0
      - name: Patch static video quality policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('lib/hardcore-archive-core.sh')
          core = core_path.read_text()

          old = r'''MEASURED_QUALITY_KIND=''
MEASURED_QUALITY_SCORE=''
QUALITY_WORKER_THREADS=''
QUALITY_VMAF_AVAILABLE=''

quality_worker_threads() {
    local requested=${HARDCORE_ARCHIVE_VIDEO_QUALITY_THREADS:-auto} available
    if [[ $requested != auto && ! $requested =~ ^([1-9]|[1-5][0-9]|6[0-4])$ ]]; then
        printf 'Error: VIDEO_QUALITY_THREADS must be auto or an integer from 1 to 64.\n' >&2
        return 1
    fi
    available=$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || printf 1)
    [[ $available =~ ^[1-9][0-9]{0,5}$ ]] || available=1
    if [[ $requested == auto ]]; then
        requested=$available
        (( requested > 8 )) && requested=8
    fi
    (( requested > available )) && requested=$available
    printf '%s' "$requested"
}

measure_preflight_quality() {
    local start=$1 length=$2 encoded=$3 width height dimensions log_file score started
    MEASURED_QUALITY_KIND=''
    MEASURED_QUALITY_SCORE=''
    [[ $quality_check != off ]] || return 1

    dimensions=$(ffprobe -v error -select_streams V:0 -show_entries stream=width,height \
        -of csv=p=0:s=x "$encoded" 2>/dev/null | head -n1)
    IFS=x read -r width height <<< "$dimensions"
    [[ $width =~ ^[0-9]+$ && $height =~ ^[0-9]+$ ]] || return 1

    if [[ -z $QUALITY_WORKER_THREADS ]]; then
        QUALITY_WORKER_THREADS=$(quality_worker_threads) || return 1
    fi
    if [[ -z $QUALITY_VMAF_AVAILABLE ]]; then
        if has_filter libvmaf; then QUALITY_VMAF_AVAILABLE=true; else QUALITY_VMAF_AVAILABLE=false; fi
    fi
    if [[ $QUALITY_VMAF_AVAILABLE == true ]]; then
        log_file="${encoded}.vmaf.json"
        preflight_files+=("$log_file")
        # Drop stale scores before a retry; only this FFmpeg invocation can pass.
        rm -f -- "$log_file"
        printf '\nVMAF scoring: %sx%s, %s CPU worker(s), every sample frame...\n' \
            "$width" "$height" "$QUALITY_WORKER_THREADS"
        started=$SECONDS
        # Matroska rounds sample timestamps to milliseconds. Framesync's
        # default floor matching can then compare a frame to its predecessor
        # in the MP4 reference. Nearest timestamp matching keeps frame content
        # aligned without discarding timestamps or changing the frame rate.
        if ffmpeg -hide_banner -v error -nostdin \
            -ss "$start" -t "$length" -i "$input" -i "$encoded" \
            -filter_complex "[0:v:0]settb=AVTB,setpts=PTS-STARTPTS,scale=${width}:${height}:flags=lanczos:out_range=tv,format=yuv420p[ref];[1:v:0]settb=AVTB,setpts=PTS-STARTPTS,scale=${width}:${height}:flags=bilinear:out_range=tv,format=yuv420p[dist];[dist][ref]libvmaf=log_fmt=json:log_path=${log_file}:n_threads=${QUALITY_WORKER_THREADS}:n_subsample=1:ts_sync_mode=nearest" \
            -an -f null - >/dev/null 2>&1; then
            printf 'VMAF scoring finished in %ss.\n' "$((SECONDS - started))"
            score=$(python3 - "$log_file" <<'PYVMAF'
import json, math, sys
try:
    with open(sys.argv[1], 'r', encoding='utf-8') as handle:
        value = float(json.load(handle)['pooled_metrics']['vmaf']['mean'])
    if math.isfinite(value) and 0.0 <= value <= 100.0:
        print(f'{value:.6f}')
except (OSError, ValueError, TypeError, KeyError, json.JSONDecodeError):
    pass
PYVMAF
)
            if [[ $score =~ ^[0-9]+([.][0-9]+)?$ ]]; then
                MEASURED_QUALITY_KIND=VMAF
                MEASURED_QUALITY_SCORE=$score
                return 0
            fi
        else
            printf 'VMAF scoring failed after %ss.\n' "$((SECONDS - started))"
        fi
    fi

    # Strict quality policy: VMAF failure is a preflight failure; SSIM is not a fallback.
    return 1
}
'''

          new = r'''MEASURED_QUALITY_KIND=''
MEASURED_QUALITY_SCORE=''
QUALITY_WORKER_THREADS=''
QUALITY_VMAF_AVAILABLE=''
QUALITY_SOURCE_DISPLAY_WIDTH=''
QUALITY_SOURCE_DISPLAY_HEIGHT=''
QUALITY_SOURCE_ROTATION=''
QUALITY_VMAF_POLICY_VERSION='source-display-v1'

quality_worker_threads() {
    local requested=${HARDCORE_ARCHIVE_VIDEO_QUALITY_THREADS:-auto} available
    if [[ $requested != auto && ! $requested =~ ^([1-9]|[1-5][0-9]|6[0-4])$ ]]; then
        printf 'Error: VIDEO_QUALITY_THREADS must be auto or an integer from 1 to 64.\n' >&2
        return 1
    fi
    available=$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || printf 1)
    [[ $available =~ ^[1-9][0-9]{0,5}$ ]] || available=1
    if [[ $requested == auto ]]; then
        requested=$available
        (( requested > 8 )) && requested=8
    fi
    (( requested > available )) && requested=$available
    printf '%s' "$requested"
}

quality_round_even() {
    LC_NUMERIC=C awk -v value="$1" 'BEGIN {
        if (value <= 0) exit 1
        rounded=int(value/2+0.5)*2
        if (rounded < 2) rounded=2
        printf "%.0f", rounded
    }'
}

# Convert coded dimensions plus sample-aspect-ratio into a square-pixel display
# canvas. Rotation is applied because FFmpeg autorotates decoded frames by
# default; a 90/270 degree rotation also inverts the physical pixel aspect.
quality_display_geometry() {
    local coded_width=$1 coded_height=$2 sar=${3:-1:1} rotation=${4:-0}
    local sar_num=1 sar_den=1 display_width display_height
    [[ $coded_width =~ ^[1-9][0-9]*$ && $coded_height =~ ^[1-9][0-9]*$ ]] || return 1
    if [[ $sar =~ ^([1-9][0-9]*):([1-9][0-9]*)$ ]]; then
        sar_num=${BASH_REMATCH[1]}
        sar_den=${BASH_REMATCH[2]}
    fi
    [[ $rotation =~ ^-?[0-9]+$ ]] || rotation=0
    rotation=$(( (rotation % 360 + 360) % 360 ))
    case $rotation in
        90|270)
            display_width=$(LC_NUMERIC=C awk -v h="$coded_height" -v n="$sar_num" -v d="$sar_den" \
                'BEGIN {printf "%.9f", h*d/n}')
            display_height=$coded_width
            ;;
        *)
            display_width=$(LC_NUMERIC=C awk -v w="$coded_width" -v n="$sar_num" -v d="$sar_den" \
                'BEGIN {printf "%.9f", w*n/d}')
            display_height=$coded_height
            ;;
    esac
    display_width=$(quality_round_even "$display_width") || return 1
    display_height=$(quality_round_even "$display_height") || return 1
    printf '%s\t%s' "$display_width" "$display_height"
}

quality_source_display_geometry() {
    local dimensions coded_width coded_height sar rotation geometry
    if [[ $QUALITY_SOURCE_DISPLAY_WIDTH =~ ^[1-9][0-9]*$ && \
          $QUALITY_SOURCE_DISPLAY_HEIGHT =~ ^[1-9][0-9]*$ ]]; then
        printf '%s\t%s' "$QUALITY_SOURCE_DISPLAY_WIDTH" "$QUALITY_SOURCE_DISPLAY_HEIGHT"
        return 0
    fi
    dimensions=$(ffprobe -v error -select_streams V:0 -show_entries stream=width,height \
        -of csv=p=0:s=x "$input" 2>/dev/null | head -n1) || return 1
    IFS=x read -r coded_width coded_height <<< "$dimensions"
    [[ $coded_width =~ ^[1-9][0-9]*$ && $coded_height =~ ^[1-9][0-9]*$ ]] || return 1
    sar=$(ffprobe -v error -select_streams V:0 -show_entries stream=sample_aspect_ratio \
        -of default=nw=1:nk=1 "$input" 2>/dev/null | head -n1 || true)
    rotation=$(ffprobe -v error -select_streams V:0 -show_entries stream_side_data=rotation \
        -of default=nw=1:nk=1 "$input" 2>/dev/null | head -n1 || true)
    geometry=$(quality_display_geometry "$coded_width" "$coded_height" "$sar" "$rotation") || return 1
    IFS=$'\t' read -r QUALITY_SOURCE_DISPLAY_WIDTH QUALITY_SOURCE_DISPLAY_HEIGHT <<< "$geometry"
    QUALITY_SOURCE_ROTATION=${rotation:-0}
    printf '%s\t%s' "$QUALITY_SOURCE_DISPLAY_WIDTH" "$QUALITY_SOURCE_DISPLAY_HEIGHT"
}

# Keep the project's established v0 score family so the configured VMAF floor
# is not silently reinterpreted. The official 4K v0 model is used for UHD-or-
# larger viewing canvases; other canvases retain the standard 1080p/3H model.
quality_vmaf_model_for_canvas() {
    local width=$1 height=$2 long_side short_side
    if (( width >= height )); then long_side=$width; short_side=$height; else long_side=$height; short_side=$width; fi
    if (( long_side >= 3840 && short_side >= 2160 )); then
        printf 'vmaf_4k_v0.6.1\t4K/1.5H'
    else
        printf 'vmaf_v0.6.1\t1080p/3H'
    fi
}

# Normalize both decoded streams identically: square pixels, limited-range
# 8-bit 4:2:0, source-sized viewing canvas, and aspect-preserving fit/pad. A
# smaller candidate is therefore upscaled for comparison instead of shrinking
# the reference. Bicubic matches Netflix's cross-resolution FFmpeg guidance.
quality_vmaf_filter_graph() {
    local eval_width=$1 eval_height=$2 log_file=$3 threads=$4 model=$5 ratio normalize fit
    ratio="${eval_width}/${eval_height}"
    normalize="scale=w='max(2,trunc(iw*if(eq(sar,0),1,sar)/2)*2)':h='max(2,trunc(ih/2)*2)':flags=bicubic:out_range=tv,setsar=1"
    fit="scale=w='if(gt(a,${ratio}),${eval_width},-2)':h='if(gt(a,${ratio}),-2,${eval_height})':flags=bicubic:out_range=tv,pad=${eval_width}:${eval_height}:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1,format=yuv420p"
    printf '%s' "[0:v:0]settb=AVTB,setpts=PTS-STARTPTS,${normalize},${fit}[ref];[1:v:0]settb=AVTB,setpts=PTS-STARTPTS,${normalize},${fit}[dist];[dist][ref]libvmaf=model='version=${model}':log_fmt=json:log_path=${log_file}:n_threads=${threads}:n_subsample=1:ts_sync_mode=nearest"
}

measure_preflight_quality() {
    local start=$1 length=$2 encoded=$3 geometry eval_width eval_height model_info model model_condition
    local log_file score started filter_graph
    MEASURED_QUALITY_KIND=''
    MEASURED_QUALITY_SCORE=''
    [[ $quality_check != off ]] || return 1

    geometry=$(quality_source_display_geometry) || return 1
    IFS=$'\t' read -r eval_width eval_height <<< "$geometry"
    model_info=$(quality_vmaf_model_for_canvas "$eval_width" "$eval_height") || return 1
    IFS=$'\t' read -r model model_condition <<< "$model_info"

    if [[ -z $QUALITY_WORKER_THREADS ]]; then
        QUALITY_WORKER_THREADS=$(quality_worker_threads) || return 1
    fi
    if [[ -z $QUALITY_VMAF_AVAILABLE ]]; then
        if has_filter libvmaf; then QUALITY_VMAF_AVAILABLE=true; else QUALITY_VMAF_AVAILABLE=false; fi
    fi
    if [[ $QUALITY_VMAF_AVAILABLE == true ]]; then
        log_file="${encoded}.vmaf.json"
        preflight_files+=("$log_file")
        # Drop stale scores before a retry; only this FFmpeg invocation can pass.
        rm -f -- "$log_file"
        printf '\nVMAF scoring: source-display %sx%s, %s (%s), %s CPU worker(s), every sample frame...\n' \
            "$eval_width" "$eval_height" "$model" "$model_condition" "$QUALITY_WORKER_THREADS"
        filter_graph=$(quality_vmaf_filter_graph "$eval_width" "$eval_height" "$log_file" \
            "$QUALITY_WORKER_THREADS" "$model") || return 1
        started=$SECONDS
        # Matroska rounds sample timestamps to milliseconds. Framesync's
        # default floor matching can then compare a frame to its predecessor
        # in the MP4 reference. Nearest timestamp matching keeps frame content
        # aligned without discarding timestamps or changing the frame rate.
        if ffmpeg -hide_banner -v error -nostdin \
            -ss "$start" -t "$length" -i "$input" -i "$encoded" \
            -filter_complex "$filter_graph" \
            -an -f null - >/dev/null 2>&1; then
            printf 'VMAF scoring finished in %ss.\n' "$((SECONDS - started))"
            score=$(python3 - "$log_file" <<'PYVMAF'
import json, math, sys
try:
    with open(sys.argv[1], 'r', encoding='utf-8') as handle:
        value = float(json.load(handle)['pooled_metrics']['vmaf']['mean'])
    if math.isfinite(value) and 0.0 <= value <= 100.0:
        print(f'{value:.6f}')
except (OSError, ValueError, TypeError, KeyError, json.JSONDecodeError):
    pass
PYVMAF
)
            if [[ $score =~ ^[0-9]+([.][0-9]+)?$ ]]; then
                MEASURED_QUALITY_KIND=VMAF
                MEASURED_QUALITY_SCORE=$score
                return 0
            fi
        else
            printf 'VMAF scoring failed after %ss.\n' "$((SECONDS - started))"
        fi
    fi

    # Strict quality policy: VMAF/model failure is a preflight failure; SSIM is not a fallback.
    return 1
}
'''

          if old not in core:
              raise SystemExit('expected old VMAF block not found')
          core = core.replace(old, new, 1)
          replacements = {
              "readonly SCRIPT_VERSION='2026-07-22-integrated-video-r3'":
                  "readonly SCRIPT_VERSION='2026-09-07-integrated-video-r4'",
              "calibration-v3-nominal-fps-nearest-timestamps-center-validation":
                  "calibration-v4-source-display-resolution-bicubic-sar-nearest-vmaf-model",
              '"video-preprocessing-v2-selection"':
                  '"video-preprocessing-v3-source-display-vmaf"',
          }
          for before, after in replacements.items():
              if core.count(before) != 1:
                  raise SystemExit(f'expected exactly one core marker: {before!r}; found {core.count(before)}')
              core = core.replace(before, after, 1)
          core_path.write_text(core)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          anchor = "VMAF scoring runs on the **CPU**, separately from hardware encoding. `VIDEO_QUALITY_THREADS=auto` explicitly enables up to 8 VMAF workers, bounded by the logical CPUs available to the process."
          if anchor not in readme:
              raise SystemExit('README VMAF anchor not found')
          addition = r'''

### VMAF viewing-resolution policy

Quality scoring uses a viewing canvas chosen from the **source display resolution**, not the encoded candidate's dimensions. Source coded size, sample aspect ratio, and 90/270-degree display rotation are normalized to an even-sized square-pixel canvas. Both reference and distorted frames are then put through the same limited-range 8-bit 4:2:0 normalization. A smaller candidate is bicubic-upscaled to the source canvas; an aspect-ratio mismatch is fitted without stretching and padded, so lost resolution or an incorrect DAR remains visible to the metric instead of being hidden by shrinking the reference.

Timestamp policy is unchanged: both streams use `AVTB`, reset to `PTS-STARTPTS`, and libvmaf framesync uses `ts_sync_mode=nearest`; no frame-rate conversion or frame subsampling is introduced.

Hardcore Archive deliberately stays on the established VMAF v0 score family so `QUALITY_CHECK=92` keeps the same numeric target rather than silently switching to the differently calibrated VMAF v1 models. Source canvases at UHD/4K or larger use the official `vmaf_4k_v0.6.1` model (trained for 4K at 1.5H); smaller canvases use `vmaf_v0.6.1` (trained for a 1080p HDTV at 3H). If the selected model is unavailable, scoring fails closed and the original video is preserved. The models are not exact absolute predictors for every source resolution, viewing distance, HDR transfer function, frame rate, or display; in particular 1440p/720p source-sized evaluation and >4K/HFR/HDR material fall outside the exact legacy training condition. Netflix's newer VMAF v1 models add explicit 1080p/4K/HFR conditions and recommend 10-bit SDR evaluation, but adopting them would require separately re-validating the project's numeric quality threshold. The current policy therefore keeps the existing 8-bit limited-range normalization and v0 threshold semantics while fixing the resolution-loss blind spot.
'''
          readme = readme.replace(anchor, anchor + addition, 1)
          readme_path.write_text(readme)
          PY
          bash -n lib/hardcore-archive-core.sh
          python3 - <<'PY'
          from pathlib import Path
          core = Path('lib/hardcore-archive-core.sh').read_text()
          helper = core.split("<<'__HARDCORE_ARCHIVE_VIDEO_HELPER__'\n", 1)[1].split("\n__HARDCORE_ARCHIVE_VIDEO_HELPER__", 1)[0]
          import subprocess
          subprocess.run(['bash', '-n'], input=helper, text=True, check=True)
          PY
      - name: Commit patched files and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/vmaf-source-display-patch.yml
          git add lib/hardcore-archive-core.sh README.md
          git commit -m "Score video quality at source display resolution"
          git push origin HEAD:fix/vmaf-source-display-resolution
