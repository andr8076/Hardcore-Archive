name: Build media runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/media-runtime/**'
      - '.github/workflows/media-runtime.yml'

permissions:
  contents: write

concurrency:
  group: media-runtime-latest
  cancel-in-progress: true

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reset rolling media runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=media-runtime-latest
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          source packaging/media-runtime/versions.env
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Hardcore Archive media runtime" \
            --notes "Latest pinned FFmpeg ${FFMPEG_VERSION} + VMAF runtime used by Hardcore Archive. Platform assets are uploaded independently after their smoke tests pass." \
            --prerelease

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl git meson ninja-build pkg-config nasm yasm \
            libdrm-dev libva-dev
          sudo apt-get install -y libvpl-dev || true

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install meson ninja pkg-config nasm yasm

      - name: Build pinned FFmpeg and VMAF runtime
        shell: bash
        run: bash packaging/media-runtime/build.sh

      - name: Smoke-test runtime
        shell: bash
        run: bash packaging/media-runtime/smoke-test.sh dist/media-runtime/runtime

      - name: Package runtime
        shell: bash
        run: |
          asset="hardcore-archive-media-runtime-${{ matrix.target }}.tar.gz"
          tar -C dist/media-runtime -czf "$asset" runtime
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          mkdir -p release-assets
          mv "$asset" "$asset.sha256" release-assets/

      - name: Upload platform runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload media-runtime-latest release-assets/* --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-runtime-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: ignore
