name: One-shot completed video quality validation

# Production commit excludes workflow files; CI wiring is updated separately.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-video-quality-validation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify completed-output video quality policy
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-final-video-quality.py
          python3 tools/finalize-video-quality.py
          bash -n lib/hardcore-archive-core.sh
          bash -n lib/video-acceleration.sh
          bash -n lib/video-quality-final.sh
          python3 -m py_compile lib/hardcore-archive-video-quality.py
          python3 tests/video-final-quality.py
          python3 tests/video-quality-performance.py
          python3 tests/video-acceleration.py
          bash tests/video-calibration-cache.sh
          bash tests/module-layout.sh
          git diff --check
      - name: Commit implementation to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Hardcore Archive automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/hardcore-archive-core.sh lib/video-acceleration.sh config README.md tests/video-final-quality.py tests/video-quality-performance.py tests/video-acceleration.py tests/module-layout.sh tests/frontend-policy.sh
          git diff --cached --quiet && { echo 'No implementation changes to commit.'; exit 0; }
          git commit -m 'Validate completed video output quality'
          git push origin HEAD:main
