name: Apply nested core integration

on:
  push:
    branches: [perf/parallel-nested-archives]

permissions:
  contents: write

jobs:
  patch-core:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/parallel-nested-archives
          fetch-depth: 0
      - name: Insert static nested module handoff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/hardcore-archive-core.sh')
          text = path.read_text(encoding='utf-8')
          source_line = 'source "$(dirname -- "${BASH_SOURCE[0]}")/nested.sh"'
          if source_line in text:
              raise SystemExit(0)
          needle = 'NESTED_TIMING_STARTED=$(hardcore_timing_now 2>/dev/null) || NESTED_TIMING_STARTED=0\nprepare_and_add_nested_archives\n'
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one nested execution handoff, found {text.count(needle)}')
          replacement = source_line + '\n' + needle
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          if git diff --quiet -- lib/hardcore-archive-core.sh; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/hardcore-archive-core.sh
          git commit -m 'Load parallel nested execution module'
          git push origin HEAD:perf/parallel-nested-archives
