name: One-shot VMAF geometry cleanup

on:
  push:
    branches: [fix/vmaf-source-display-resolution]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vmaf-source-display-resolution
          fetch-depth: 0
      - run: python3 .github/final_vmaf_patch.py
      - name: Commit cleanup and remove temporary files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/final-vmaf-patch.yml .github/final_vmaf_patch.py
          git add lib/hardcore-archive-core.sh README.md
          git commit -m "Correct rotated source display geometry"
          git push origin HEAD:fix/vmaf-source-display-resolution
